name: Heatmap

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: MrBolas
        run: python3 scripts/heatmap.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain heatmap.svg)" ]; then
            echo "heatmap unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heatmap.svg
          git commit -m "Update contribution heatmap"
          git push
